name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Foundation quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies from lockfiles
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Install Encore CLI 1.57.13
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://encore.dev/install.sh \
            --output "$RUNNER_TEMP/install-encore.sh"
          bash "$RUNNER_TEMP/install-encore.sh" 1.57.13
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain and container runtime
        run: |
          node --version
          npm --version
          encore version
          docker version

      - name: Backend type check
        run: npm run typecheck

      - name: Pure authorization tests
        run: npm run test:unit

      - name: Encore database integration tests
        run: npm run test:integration

      - name: Backend dependency audit
        run: npm audit --audit-level=high

      - name: Frontend lint
        run: npm --prefix frontend run lint

      - name: Frontend type check
        run: npm --prefix frontend run typecheck

      - name: Frontend foundation tests
        run: npm --prefix frontend test

      - name: Frontend production build
        run: npm --prefix frontend run build

      - name: Frontend dependency audit
        run: npm --prefix frontend audit --audit-level=high

      - name: Verify generated Encore client
        run: |
          npm --prefix frontend run client:generate
          git diff --exit-code -- frontend/src/lib/client.generated.ts

      - name: Verify repository consistency
        run: |
          git diff --check
          git diff --exit-code
